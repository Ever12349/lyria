<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css?v=layout">
<style>body{background:#2a2a2c}.menubar{position:absolute;top:24px;right:40px;color:#ddd;font-size:13px;display:flex;gap:16px}
.popover{margin-top:8px}</style></head>
<body>
<div style="width:420px;position:relative">
  <div class="menubar"><span>♫ Lyria</span><span>9:41</span></div>
  <div class="popover" style="margin:40px auto 0">
    <div style="padding:14px 14px 10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--border)">
      <div class="cover"></div>
      <div style="flex:1"><div class="t" style="font-size:13px;font-weight:600">星际旅行</div><div class="a" style="font-size:11px;color:var(--text2)">Dreamscape</div></div>
    </div>
    <div style="padding:12px 14px">
      <div class="prog" style="margin-bottom:10px"><span>1:48</span><div class="bar"><div class="fill"></div><div class="knob"></div></div><span>4:32</span></div>
      <div class="btns" style="justify-content:center"><span>⏮</span><div class="play">▶</div><span>⏭</span></div>
    </div>
    <div style="padding:0 14px 14px">
      <div style="font-size:11px;color:var(--text3);margin-bottom:6px">接下来</div>
      <div style="font-size:12px;padding:8px 0;border-top:1px solid var(--border)">午夜信号 · Aurora Line</div>
      <div style="font-size:12px;padding:8px 0;border-top:1px solid var(--border)">漂浮的城市 · Neon Harbor</div>
      <div style="font-size:12px;padding:8px 0;border-top:1px solid var(--border)">光的碎片 · Lumen</div>
    </div>
  </div>
</div>
</body></html>
